name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Bootstrap phase: first environment-backed agent should commit an
      # npm-generated package-lock.json and replace this with npm ci.
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
