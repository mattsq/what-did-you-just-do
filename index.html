<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>What Did You Just Do?</title>
  </head>
  <body>
    <main>
      <header>
        <h1>What Did You Just Do?</h1>
        <p>A cooperative puzzle experiment. Single-browser preview: two-player rooms are not implemented yet.</p>
        <div class="toolbar" role="group" aria-label="Preview controls">
          <button type="button" data-role="A" aria-pressed="true">Western clearing (A)</button>
          <button type="button" data-role="B" aria-pressed="false">Eastern clearing (B)</button>
          <button type="button" id="reset">Reset</button>
          <button type="button" id="mute" aria-pressed="false">Sound on</button>
        </div>
        <p id="connection-state" role="status" aria-live="polite">Connecting to server…</p>
      </header>
      <div id="game" aria-label="Game canvas"></div>
      <p id="interaction-hint" aria-live="polite">Move with WASD or the arrow keys. Walk up to something strange.</p>
      <pre id="dev-panel" hidden></pre>
    </main>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
